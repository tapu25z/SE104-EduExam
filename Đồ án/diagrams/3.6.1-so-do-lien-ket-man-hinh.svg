    <text x="973" y="526" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Phân quyền xem theo giảng viên</text>
  </g>

  <!-- MH07: BÁO CÁO NĂM -->
  <g filter="url(#shadow)">
