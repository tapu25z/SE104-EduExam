    <text x="385" y="663" text-anchor="middle" font-family="'Times New Roman', Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0F766E">MH07: BÁO CÁO TỔNG HỢP NĂM</text>
    <text x="205" y="693" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Chọn năm học cần thống kê (BM5 - UC05)</text>
    <text x="205" y="715" font-family="Arial, sans-serif" font-size="12" fill="#334155">• 2 Biểu đồ cột: Số lượng Đề thi &amp; Số lượng Bài chấm theo từng môn</text>
    <text x="205" y="737" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Bảng chi tiết tổng hợp: Số đề, Tỷ lệ % đề, Số bài chấm, Tỷ lệ % chấm</text>
    <text x="205" y="759" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Tự động tính tổng toàn trường và tỷ lệ chính xác theo công thức 1.1, 1.2</text>
    <text x="205" y="781" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Hỗ trợ xem trực quan trên mọi kích thước màn hình</text>
  </g>

  <!-- MH08: QUẢN LÝ LỚP HỌC -->
  <g filter="url(#shadow)">
