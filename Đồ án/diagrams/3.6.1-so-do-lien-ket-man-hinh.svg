    <text x="973" y="438" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Bộ lọc từ khóa, Môn, Kỳ, Năm (BM4)</text>
    <text x="973" y="460" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Bảng kết quả đề thi toàn diện (UC04)</text>
    <text x="973" y="482" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Modal Xem trước / In đề thi chuẩn</text>
