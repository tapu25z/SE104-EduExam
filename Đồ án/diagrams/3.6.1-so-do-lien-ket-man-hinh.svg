    <text x="695" y="693" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Danh sách các lớp học phụ trách của giảng viên (BM7 - UC07)</text>
    <text x="695" y="715" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Modal Tạo mới / Sửa thông tin lớp (Mã lớp duy nhất, Tên lớp)</text>
    <text x="695" y="737" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Modal Quản lý danh sách sinh viên: Thêm SV, Xóa SV khỏi lớp</text>
