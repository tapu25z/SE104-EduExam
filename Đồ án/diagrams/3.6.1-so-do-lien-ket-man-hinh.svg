    <text x="658" y="438" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Bộ chọn Môn, Đề thi, Lớp học (BM3)</text>
    <text x="658" y="460" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Bảng nhập điểm tương tác tức thì</text>
    <text x="658" y="482" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Ràng buộc điểm 0–10, bước 0.5 (QĐ3)</text>
    <text x="658" y="504" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Tự động quy đổi điểm chữ A–F</text>
    <text x="658" y="526" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Lưu đồng loạt &amp; thanh tiến độ chấm</text>
  </g>

