  <text x="630" y="70" text-anchor="middle" font-family="'Times New Roman', Arial, sans-serif" font-size="14" fill="#64748B">Luồng điều hướng, liên kết nghiệp vụ và phân quyền truy cập giữa 10 màn hình hệ thống</text>

  <!-- ==================== 0. MH00 - MÀN HÌNH TRANG CHỦ ==================== -->
  <g filter="url(#shadow)">
    <rect x="35" y="105" width="220" height="165" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5" />
    <rect x="35" y="105" width="220" height="36" rx="10" fill="#E0F2FE" />
    <rect x="35" y="131" width="220" height="10" fill="#E0F2FE" />
    <text x="145" y="129" text-anchor="middle" font-family="'Times New Roman', Arial, sans-serif" font-size="15" font-weight="bold" fill="#0369A1">MH00: TRANG CHỦ</text>
    <text x="48" y="160" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Giới thiệu nền tảng EduExam</text>
    <text x="48" y="182" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Tính năng, giải pháp, trải nghiệm</text>
    <text x="48" y="204" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Trình tính quy đổi điểm QĐ3</text>
    <text x="48" y="226" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Nút Đăng nhập &amp; Đăng ký</text>
    <text x="48" y="248" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Nút Bắt đầu ngay (Hero CTA)</text>
  </g>

  <!-- ==================== 1. MH01 - MÀN HÌNH ĐĂNG NHẬP ==================== -->
  <g filter="url(#shadow)">
    <rect x="330" y="105" width="230" height="165" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5" />
    <rect x="330" y="105" width="230" height="36" rx="10" fill="#EFF6FF" />
    <rect x="330" y="131" width="230" height="10" fill="#EFF6FF" />
    <text x="445" y="129" text-anchor="middle" font-family="'Times New Roman', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E40AF">MH01: ĐĂNG NHẬP</text>
    <text x="343" y="160" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Biểu mẫu xác thực tài khoản</text>
    <text x="343" y="182" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Tên đăng nhập &amp; Mật khẩu</text>
    <text x="343" y="204" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Phân quyền GV / Admin (UC00)</text>
    <text x="343" y="226" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Tab Đăng ký tài khoản mới</text>
    <text x="343" y="248" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Lưu Token phiên 8 giờ</text>
  </g>

  <!-- ==================== 2. MH02 - MÀN HÌNH TỔNG QUAN (DASHBOARD) ==================== -->
  <g filter="url(#shadow)">
    <rect x="640" y="100" width="310" height="175" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3" />
    <rect x="640" y="100" width="310" height="38" rx="12" fill="#EEF2FF" />
    <rect x="640" y="128" width="310" height="10" fill="#EEF2FF" />
    <text x="795" y="125" text-anchor="middle" font-family="'Times New Roman', Arial, sans-serif" font-size="16" font-weight="bold" fill="#3730A3">MH02: TỔNG QUAN (DASHBOARD)</text>
    <text x="655" y="158" font-family="Arial, sans-serif" font-size="12.5" fill="#1E293B">• 4 Thẻ KPI: Câu hỏi, Đề thi, Bài chấm, SV</text>
    <text x="655" y="180" font-family="Arial, sans-serif" font-size="12.5" fill="#1E293B">• Phân bố ngân hàng đề 4 môn học (QĐ1)</text>
    <text x="655" y="202" font-family="Arial, sans-serif" font-size="12.5" fill="#1E293B">• Lối tắt thao tác nhanh &amp; trạng thái</text>
    <text x="655" y="224" font-family="Arial, sans-serif" font-size="12.5" fill="#1E293B">• Thanh Sidebar điều hướng toàn diện</text>
    <rect x="655" y="238" width="280" height="18" rx="4" fill="#E0E7FF" />
    <text x="795" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4338CA">TRUNG TÂM ĐIỀU HƯỚNG CHÍNH (SPA HUB)</text>
  </g>

  <!-- ==================== 9. MH09 - QUẢN LÝ TÀI KHOẢN (ADMIN ONLY) ==================== -->
  <g filter="url(#shadow)">
    <rect x="1010" y="105" width="215" height="165" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2" />
    <rect x="1010" y="105" width="215" height="36" rx="10" fill="#FEF3C7" />
    <rect x="1010" y="131" width="215" height="10" fill="#FEF3C7" />
    <text x="1117" y="129" text-anchor="middle" font-family="'Times New Roman', Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400E">MH09: QUẢN LÝ TK</text>
    <text x="1022" y="160" font-family="Arial, sans-serif" font-size="12" fill="#78350F">• Dành cho Admin (UC06)</text>
    <text x="1022" y="182" font-family="Arial, sans-serif" font-size="12" fill="#78350F">• Danh sách giảng viên (BM6)</text>
    <text x="1022" y="204" font-family="Arial, sans-serif" font-size="12" fill="#78350F">• Modal Cấp mới tài khoản</text>
    <text x="1022" y="226" font-family="Arial, sans-serif" font-size="12" fill="#78350F">• Khóa / Mở khóa tài khoản</text>
    <text x="1022" y="248" font-family="Arial, sans-serif" font-size="12" fill="#78350F">• Đặt lại mật khẩu chuẩn</text>
  </g>

  <!-- ==================== FUNCTIONAL SCREENS (ROW 2 & 3) ==================== -->
  <!-- MH03: QUẢN LÝ CÂU HỎI -->
  <g filter="url(#shadow)">
    <rect x="35" y="385" width="255" height="165" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <rect x="35" y="385" width="255" height="34" rx="10" fill="#E0F2FE" />
    <rect x="35" y="409" width="255" height="10" fill="#E0F2FE" />
    <text x="162" y="408" text-anchor="middle" font-family="'Times New Roman', Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0369A1">MH03: NGÂN HÀNG CÂU HỎI</text>
    <text x="48" y="438" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Quản lý câu hỏi theo môn &amp; độ khó (QĐ1)</text>
    <text x="48" y="460" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Tìm kiếm, bộ lọc, xem Card/Table</text>
    <text x="48" y="482" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Modal Thêm / Sửa câu hỏi (BM1)</text>
    <text x="48" y="504" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Nhập đáp án chuẩn bắt buộc</text>
    <text x="48" y="526" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Chặn xóa câu đã thuộc đề thi (QĐ1)</text>
  </g>

  <!-- MH04: SOẠN ĐỀ THI -->
  <g filter="url(#shadow)">
    <rect x="340" y="385" width="255" height="165" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" />
    <rect x="340" y="385" width="255" height="34" rx="10" fill="#F3E8FF" />
    <rect x="340" y="409" width="255" height="10" fill="#F3E8FF" />
    <text x="467" y="408" text-anchor="middle" font-family="'Times New Roman', Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#6D28D9">MH04: SOẠN ĐỀ THI</text>
    <text x="353" y="438" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Danh sách đề thi cá nhân (UC02)</text>
    <text x="353" y="460" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Modal Tạo / Sửa đề thi (BM2)</text>
    <text x="353" y="482" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Chọn 1–5 câu cùng môn (QĐ2)</text>
    <text x="353" y="504" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Phân bổ điểm, kiểm tra Tổng = 10</text>
    <text x="353" y="526" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Khóa đề đã có bài chấm (QĐ2)</text>
  </g>

  <!-- MH05: GHI NHẬN CHẤM THI -->
  <g filter="url(#shadow)">
