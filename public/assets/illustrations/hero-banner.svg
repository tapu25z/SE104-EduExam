<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect x="0" y="0" width="500" height="320" fill="none" />
  
  <!-- Back Floating Shapes -->
  <circle cx="380" cy="80" r="60" fill="#60a5fa" opacity="0.25" />
  <circle cx="140" cy="220" r="70" fill="#a78bfa" opacity="0.2" />
  
  <!-- Central Exam Sheet Card -->
  <g filter="url(#shadow)">
    <rect x="170" y="40" width="180" height="240" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2" />
    <!-- Header of Sheet -->
    <rect x="195" y="65" width="90" height="10" rx="5" fill="#2563eb" />
    <rect x="195" y="85" width="130" height="6" rx="3" fill="#94a3b8" />
    <line x1="195" y1="105" x2="325" y2="105" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Question 1 -->
    <circle cx="205" cy="125" r="5" fill="#10b981" />
    <rect x="220" y="122" width="100" height="6" rx="3" fill="#64748b" />
    <rect x="220" y="134" width="75" height="5" rx="2.5" fill="#cbd5e1" />
    
    <!-- Question 2 -->
    <circle cx="205" cy="160" r="5" fill="#3b82f6" />
    <rect x="220" y="157" width="95" height="6" rx="3" fill="#64748b" />
    <rect x="220" y="169" width="65" height="5" rx="2.5" fill="#cbd5e1" />
    
    <!-- Question 3 -->
    <circle cx="205" cy="195" r="5" fill="#f59e0b" />
    <rect x="220" y="192" width="85" height="6" rx="3" fill="#64748b" />
    <rect x="220" y="204" width="80" height="5" rx="2.5" fill="#cbd5e1" />
    
    <!-- Grade Stamp -->
    <g transform="translate(270, 210) rotate(-12)">
      <rect x="0" y="0" width="60" height="36" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
      <text x="30" y="24" font-family="sans-serif" font-weight="800" font-size="20" fill="#059669" text-anchor="middle">A+</text>
    </g>
  </g>
  
  <!-- Left Floating Widget -->
  <g filter="url(#shadow)" transform="translate(60, 90)">
    <rect x="0" y="0" width="120" height="65" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" />
    <circle cx="22" cy="24" r="10" fill="#dbeafe" />
    <path d="M18 24 L21 27 L27 21" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="40" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#1e293b">Ngân Hàng Đề Thi</text>
    <text x="40" y="33" font-family="sans-serif" font-size="8" font-weight="500" fill="#64748b">Tự động đồng bộ</text>
    <rect x="12" y="46" width="96" height="6" rx="3" fill="#eff6ff" />
    <rect x="12" y="46" width="80" height="6" rx="3" fill="#3b82f6" />
  </g>
  
  <!-- Right Floating Widget -->
  <g filter="url(#shadow)" transform="translate(330, 160)">
    <rect x="0" y="0" width="130" height="75" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
    <circle cx="24" cy="26" r="10" fill="#dcfce7" />
    <path d="M20 26 L23 29 L29 23" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="24" font-family="sans-serif" font-size="10" font-weight="700" fill="#1e293b">Sổ Điểm Điện Tử</text>
    <text x="42" y="35" font-family="sans-serif" font-size="8" font-weight="500" fill="#64748b">Quy đổi A - F tự động</text>
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="18" height="16" rx="4" fill="#10b981" />
      <text x="9" y="12" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
      
      <rect x="22" y="0" width="18" height="16" rx="4" fill="#3b82f6" />
      <text x="31" y="12" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
      
      <rect x="44" y="0" width="18" height="16" rx="4" fill="#06b6d4" />
      <text x="53" y="12" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>

      <rect x="66" y="0" width="18" height="16" rx="4" fill="#f59e0b" />
      <text x="75" y="12" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>

      <rect x="88" y="0" width="18" height="16" rx="4" fill="#ef4444" />
      <text x="97" y="12" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">F</text>
    </g>
  </g>
</svg>