<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <linearGradient id="exGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="exSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect x="0" y="0" width="200" height="160" fill="none" />
  
  <circle cx="100" cy="80" r="56" fill="#eff6ff" />
  <circle cx="45" cy="50" r="14" fill="#bfdbfe" opacity="0.6" />
  
  <!-- Stacked back papers -->
  <rect x="68" y="25" width="76" height="100" rx="10" fill="#dbeafe" opacity="0.7" transform="rotate(-6 106 75)" />
  
  <!-- Main Exam Sheet -->
  <g filter="url(#exSh)">
    <rect x="60" y="30" width="80" height="105" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" />
    
    <!-- Top banner -->
    <path d="M60 42 C60 35.37 65.37 30 72 30 L128 30 C134.63 30 140 35.37 140 42 L140 50 L60 50 Z" fill="#2563eb" />
    <circle cx="72" cy="40" r="3" fill="#ffffff" opacity="0.8" />
    <rect x="80" y="38" width="40" height="4" rx="2" fill="#ffffff" />
    
    <!-- Exam Body Lines -->
    <circle cx="72" cy="62" r="3" fill="#3b82f6" />
    <rect x="80" y="60" width="46" height="4" rx="2" fill="#64748b" />
    
    <circle cx="72" cy="74" r="3" fill="#3b82f6" />
    <rect x="80" y="72" width="42" height="4" rx="2" fill="#64748b" />
    
    <circle cx="72" cy="86" r="3" fill="#3b82f6" />
    <rect x="80" y="84" width="48" height="4" rx="2" fill="#64748b" />

    <circle cx="72" cy="98" r="3" fill="#3b82f6" />
    <rect x="80" y="96" width="36" height="4" rx="2" fill="#64748b" />

    <rect x="72" y="112" width="56" height="12" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
    <text x="100" y="121" font-family="sans-serif" font-weight="700" font-size="7" fill="#1d4ed8" text-anchor="middle">90 PHÚT</text>
  </g>
  
  <!-- Pen floating -->
  <g transform="translate(136, 85) rotate(-35)">
    <rect x="0" y="0" width="8" height="42" rx="3" fill="#f59e0b" />
    <polygon points="0,42 8,42 4,50" fill="#d97706" />
    <circle cx="4" cy="50" r="1.5" fill="#1e293b" />
    <rect x="0" y="5" width="8" height="6" fill="#1e293b" />
  </g>
</svg>
