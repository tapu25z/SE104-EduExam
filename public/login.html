<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập • EduExam</title>
  <link rel="icon" type="image/jpeg" href="assets/eduexam-icon.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    @keyframes loginShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: loginShake 0.38s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative bg-slate-950 font-sans antialiased text-slate-900 selection:bg-blue-500 selection:text-white">

  <!-- ==================== ANIMATED LIQUID MESH BACKGROUND ==================== -->
  <div class="liquid-bg-container pointer-events-none fixed inset-0 overflow-hidden z-0">
    <div class="liquid-blob liquid-blob-1"></div>
    <div class="liquid-blob liquid-blob-2"></div>
    <div class="liquid-blob liquid-blob-3"></div>
  </div>

  <!-- Ambient Backdrop Overlay -->
  <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-2xl z-0 pointer-events-none"></div>

  <!-- ==================== SAAS AUTH CARD ==================== -->
  <main class="relative z-10 w-full max-w-[420px] bg-white rounded-3xl shadow-2xl border border-slate-100 p-8 sm:p-9 animate-fade-in transition-all">
    
    <!-- Brand Header -->
    <div class="text-center mb-6">
      <a href="/" class="inline-block mb-3.5 hover:opacity-90 transition-opacity" title="Về trang chủ EduExam">
        <img src="assets/eduexam-logo.jpg" alt="EduExam" class="h-10 sm:h-11 w-auto mx-auto object-contain">
      </a>
      <h1 id="page-title" class="text-xl font-bold text-slate-900 tracking-tight">Đăng nhập tài khoản</h1>
      <p id="page-subtitle" class="text-xs text-slate-500 mt-1">Chào mừng bạn quay lại với hệ thống</p>
    </div>

    <!-- Segmented Tab Switcher -->
    <div class="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-xl mb-6">
      <button id="tab-login" type="button" onclick="switchTab('login')"
        class="py-2 text-xs font-bold rounded-lg bg-white text-slate-900 shadow-xs transition-all cursor-pointer">
        Đăng nhập
      </button>
      <button id="tab-register" type="button" onclick="switchTab('register')"
        class="py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-800 transition-all cursor-pointer">
        Đăng ký
      </button>
    </div>

    <!-- Error Alert Banner -->
    <div id="auth-error-box" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation text-rose-500 shrink-0 text-sm"></i>
      <span id="auth-error-text" class="flex-1"></span>
    </div>

    <!-- ================= FORM ĐĂNG NHẬP ================= -->
    <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label for="login-username" class="block text-xs font-semibold text-slate-700 mb-1.5">
          Tên đăng nhập
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-user text-xs"></i>
          </div>
          <input id="login-username" type="text" autocomplete="username" required
            placeholder="Nhập tên đăng nhập"
            class="w-full pl-9 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:border-blue-600 focus:ring-3 focus:ring-blue-500/10 outline-none transition-all">
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="login-password" class="block text-xs font-semibold text-slate-700">
            Mật khẩu
          </label>
          <button type="button" onclick="showForgotAlert()" class="text-xs text-blue-600 hover:text-blue-700 hover:underline">
            Quên mật khẩu?
          </button>
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-lock text-xs"></i>
          </div>
          <input id="login-password" type="password" autocomplete="current-password" required
            placeholder="Nhập mật khẩu"
            class="w-full pl-9 pr-10 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:border-blue-600 focus:ring-3 focus:ring-blue-500/10 outline-none transition-all">
          <button type="button" onclick="togglePasswordVisibility('login-password', 'toggle-login-pwd-icon')"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer" title="Ẩn/Hiện mật khẩu">
            <i id="toggle-login-pwd-icon" class="fa-regular fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center">
        <label class="inline-flex items-center gap-2 cursor-pointer select-none">
          <input id="login-remember" type="checkbox" checked class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300">
          <span class="text-xs text-slate-600">Ghi nhớ đăng nhập</span>
        </label>
      </div>

      <button id="login-submit-btn" type="submit"
        class="w-full py-2.5 px-4 rounded-xl liquid-btn-primary text-white font-bold text-sm shadow-md shadow-blue-600/20 flex items-center justify-center gap-2 transition-all cursor-pointer">
        <span>Đăng nhập</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <!-- ================= FORM ĐĂNG KÝ ================= -->
    <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div>
        <label for="reg-fullname" class="block text-xs font-semibold text-slate-700 mb-1.5">
          Họ và tên
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-id-card text-xs"></i>
          </div>
          <input id="reg-fullname" type="text" required placeholder="Nhập họ và tên của bạn"
            class="w-full pl-9 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:border-blue-600 focus:ring-3 focus:ring-blue-500/10 outline-none transition-all">
        </div>
      </div>

      <div>
        <label for="reg-username" class="block text-xs font-semibold text-slate-700 mb-1.5">
          Tên đăng nhập
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-user text-xs"></i>
          </div>
          <input id="reg-username" type="text" autocomplete="username" required placeholder="Chọn tên đăng nhập"
            class="w-full pl-9 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:border-blue-600 focus:ring-3 focus:ring-blue-500/10 outline-none transition-all">
        </div>
      </div>

      <div>
        <label for="reg-password" class="block text-xs font-semibold text-slate-700 mb-1.5">
          Mật khẩu
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-lock text-xs"></i>
          </div>
          <input id="reg-password" type="password" minlength="6" autocomplete="new-password" required placeholder="Tối thiểu 6 ký tự"
            class="w-full pl-9 pr-10 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:border-blue-600 focus:ring-3 focus:ring-blue-500/10 outline-none transition-all">
          <button type="button" onclick="togglePasswordVisibility('reg-password', 'toggle-reg-pwd-icon')"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer" title="Ẩn/Hiện mật khẩu">
            <i id="toggle-reg-pwd-icon" class="fa-regular fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <button id="register-submit-btn" type="submit"
        class="w-full py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-blue-600 text-white font-bold text-sm shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer">
        <span>Tạo tài khoản</span>
        <i class="fa-solid fa-check text-xs"></i>
      </button>
    </form>

    <!-- Footer Links -->
    <div class="mt-6 pt-5 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
      <a href="/" class="hover:text-blue-600 font-medium inline-flex items-center gap-1.5 transition-colors">
        <i class="fa-solid fa-arrow-left text-[10px]"></i> Quay lại Trang chủ
      </a>
      <span>EduExam</span>
    </div>

  </main>

  <p class="relative z-10 text-[11px] text-slate-500 mt-6">
    © 2026 EduExam. All rights reserved.
  </p>

  <!-- ==================== SCRIPT ==================== -->
  <script>
    // Kiểm tra nếu đã có token hợp lệ thì chuyển thẳng vào /app
    (async function checkExistingSession() {
      const token = localStorage.getItem('eduexam-token');
      if (token) {
        try {
          const res = await fetch('/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (data && data.success) {
            window.location.replace('/app');
            return;
          }
        } catch (_) {}
      }
    })();

    // Đọc URL query tab
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const tab = params.get('tab');
      if (tab === 'register' || tab === 'signup') {
        switchTab('register');
      }
    });

    // Chuyển đổi tab
    function switchTab(tab) {
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const title = document.getElementById('page-title');
      const subtitle = document.getElementById('page-subtitle');
      hideError();

      if (tab === 'login') {
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
        tabLogin.className = 'py-2 text-xs font-bold rounded-lg bg-white text-slate-900 shadow-xs transition-all cursor-pointer';
        tabRegister.className = 'py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-800 transition-all cursor-pointer';
        title.textContent = 'Đăng nhập tài khoản';
        subtitle.textContent = 'Chào mừng bạn quay lại với hệ thống';
      } else {
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
        tabLogin.className = 'py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-800 transition-all cursor-pointer';
        tabRegister.className = 'py-2 text-xs font-bold rounded-lg bg-white text-slate-900 shadow-xs transition-all cursor-pointer';
        title.textContent = 'Tạo tài khoản mới';
        subtitle.textContent = 'Bắt đầu sử dụng EduExam ngay hôm nay';
      }
    }

    // Ẩn/hiện mật khẩu
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        if (icon) {
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        }
      } else {
        input.type = 'password';
        if (icon) {
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      }
    }

    // Hiển thị lỗi
    function showError(msg) {
      const box = document.getElementById('auth-error-box');
      const text = document.getElementById('auth-error-text');
      if (text) text.textContent = msg;
      if (box) {
        box.classList.remove('hidden');
        box.classList.remove('animate-shake');
        void box.offsetWidth;
        box.classList.add('animate-shake');
      }
    }

    function hideError() {
      const box = document.getElementById('auth-error-box');
      if (box) box.classList.add('hidden');
    }

    function showForgotAlert() {
      alert('Vui lòng liên hệ quản trị viên hệ thống để khôi phục mật khẩu tài khoản của bạn.');
    }

    // Xử lý đăng nhập
    async function handleLogin(e) {
      e.preventDefault();
      hideError();

      const btn = document.getElementById('login-submit-btn');
      const origHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span>Đang xác thực...</span> <i class="fa-solid fa-circle-notch fa-spin text-xs"></i>';

      const tenDangNhap = document.getElementById('login-username').value.trim();
      const matKhau = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tenDangNhap, matKhau })
        });
        const result = await res.json();

        if (!result.success) {
          showError(result.message || 'Tên đăng nhập hoặc mật khẩu không chính xác.');
          btn.disabled = false;
          btn.innerHTML = origHtml;
          return;
        }

        localStorage.setItem('eduexam-token', result.token);
        window.location.href = '/app';
      } catch (err) {
        showError('Không thể kết nối đến máy chủ.');
        btn.disabled = false;
        btn.innerHTML = origHtml;
      }
    }

    // Xử lý đăng ký
    async function handleRegister(e) {
      e.preventDefault();
      hideError();

      const btn = document.getElementById('register-submit-btn');
      const origHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span>Đang tạo tài khoản...</span> <i class="fa-solid fa-circle-notch fa-spin text-xs"></i>';

      const hoTen = document.getElementById('reg-fullname').value.trim();
      const tenDangNhap = document.getElementById('reg-username').value.trim();
      const matKhau = document.getElementById('reg-password').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hoTen, tenDangNhap, matKhau })
        });
        const result = await res.json();

        if (!result.success) {
          showError(result.message || 'Không thể tạo tài khoản.');
          btn.disabled = false;
          btn.innerHTML = origHtml;
          return;
        }

        localStorage.setItem('eduexam-token', result.token);
        window.location.href = '/app';
      } catch (err) {
        showError('Không thể kết nối đến máy chủ.');
        btn.disabled = false;
        btn.innerHTML = origHtml;
      }
    }
  </script>
</body>
</html>
